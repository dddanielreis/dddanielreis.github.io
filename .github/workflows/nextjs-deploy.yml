name: Deploy Next.js Blog

on:
  push:
    branches: ["main"]
    paths:
      - 'frameworks/nextjs-blog/**'
      - '.github/workflows/nextjs-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'
          cache-dependency-path: frameworks/nextjs-blog/package-lock.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci
        working-directory: frameworks/nextjs-blog

      - name: Build with Next.js
        run: npm run build
        working-directory: frameworks/nextjs-blog

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frameworks/nextjs-blog/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
