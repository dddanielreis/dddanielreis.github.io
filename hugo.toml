baseURL = 'https://dddanielreis.github.io/'
languageCode = 'pt-br'
title = 'Meu Blog'
theme = 'hugo-blog-awesome'

# Define o idioma padrão do conteúdo
defaultContentLanguage = 'pt-br'

# Habilita emojis no conteúdo
enableEmoji = true

# Configuração de paginação
paginate = 5

# Configurações de markup
[markup]
  [markup.highlight]
    noClasses = false
  [markup.goldmark.renderer]
    unsafe = true

############################## Português (Brasil) ################################
[Languages.pt-br]
  languageName = "Português (Brasil)"
  languageCode = "pt-br"
  contentDir = "content"
  weight = 1

  [Languages.pt-br.menu]
  [[Languages.pt-br.menu.main]]
    pageRef = "/"
    name = 'Início'
    url = '/'
    weight = 10
  [[Languages.pt-br.menu.main]]
    pageRef = "posts"
    name = 'Posts'
    url = '/posts/'
    weight = 20
  [[Languages.pt-br.menu.main]]
    pageRef = "sobre"
    name = 'Sobre'
    url = '/sobre/'
    weight = 30

[Languages.pt-br.params]
  sitename = "Meu Blog"
  defaultColor = "dark"
  description = "Um blog minimalista"
  mainSections = ['posts']
  toc = false
  tocOpen = false
  goToTop = true
  dateFormat = "2 January 2006"
  rssFeedDescription = "summary"

[Languages.pt-br.params.author]
  intro = "Meu Blog"
  name = "Daniel Reis"
  description = "Um blog minimalista com modo escuro"

[Languages.pt-br.params.webmanifest]
  name = "Meu Blog"
  short_name = "Blog"
  start_url = "/"
  theme_color = "#6b7280"
  background_color = "#131418"
  display = "standalone"

